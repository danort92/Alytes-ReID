# Re-Identification Configuration
# ==================================

model:
  backbone: "efficientnet_b0"     # "resnet50", "efficientnet_b0", "efficientnet_b2"
  pretrained: true
  embedding_dim: 512
  dropout: 0.3

loss:
  type: "arcface"                 # "arcface", "triplet", "contrastive"
  arcface:
    margin: 28.6                  # angular margin in degrees
    scale: 64
  triplet:
    margin: 0.3
    mining: "semihard"            # "hard", "semihard", "all"

training:
  epochs: 100
  batch_size: 32
  learning_rate: 0.0001
  weight_decay: 0.0001
  optimizer: "adam"               # "adam", "sgd", "adamw"
  scheduler: "cosine"             # "cosine", "step", "none"
  patience: 15
  device: "auto"
  num_workers: 4

augmentation:
  enabled: true
  horizontal_flip: 0.5
  rotation: 15                    # degrees
  brightness: 0.2
  contrast: 0.2
  color_jitter: 0.1

inference:
  top_k: 5                       # number of top matches to return
  similarity_threshold: 0.6      # below this → flag as new individual
  distance_metric: "cosine"      # "cosine" or "euclidean"

database:
  path: "data/models/reid/embeddings.db"
  index_type: "flatip"            # FAISS index type: "flatip", "ivfflat"

export:
  model_dir: "data/models/reid"
