# YOLO11 Detection Configuration
# ================================
# YOLO11 is the latest Ultralytics model (2024), successor to YOLOv8.
# Same API, better accuracy/speed tradeoff. Weights auto-downloaded on first run.

model:
  architecture: "yolo11s"        # yolo11n (fastest) | yolo11s | yolo11m | yolo11l | yolo11x
  pretrained: true
  num_classes: 1                  # single class: "toad"
  confidence_threshold: 0.5
  iou_threshold: 0.45

training:
  epochs: 100
  batch_size: 16
  image_size: 640
  learning_rate: 0.01
  optimizer: "SGD"
  patience: 20                    # early stopping patience
  augmentation: true
  device: "auto"                  # "auto", "cpu", "cuda:0"

data:
  dataset_dir: "data/processed/detection"
  train_split: 0.8
  val_split: 0.15
  test_split: 0.05
  classes:
    - "toad"

export:
  model_dir: "data/models/detection"
  format: "torchscript"           # export format for deployment

inference:
  batch_size: 1
  image_size: 640
  confidence_threshold: 0.5
  iou_threshold: 0.45
  max_detections: 5
